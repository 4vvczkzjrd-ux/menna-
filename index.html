<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Menna rafaat | Portfolio</title>
<style>
body { font-family: Arial; background: #f5f5f5; margin: 0; text-align: center; }
header { background: #0A1931; color: #D4AF37; padding: 30px; }
header h1 { margin: 0; color: white; }
table { width: 90%; margin: 20px auto; border-collapse: collapse; background: white; }
th { background: #D4AF37; color: #0A1931; padding: 12px; }
td { padding: 12px; border-bottom: 1px solid #ddd; }
</style>
</head>
<body>
<header>
<h1>Menna rafaat makram</h1>
<p>Front-End Developer</p>
</header>
<h2>مشروعي: نظام تقييم الطلاب</h2>
<table>
<thead>
<tr><th>الاسم</th><th>المتوسط</th><th>التقدير</th><th>النتيجة</th></tr>
</thead>
<tbody id="students"></tbody>
</table>
<script>
class Student {
  constructor(id, name, grades, attendance) {
    this.id=id; this.name=name; this.grades=grades; this.attendance=attendance;
  }
  getAverage(){ return this.grades.reduce((a,b)=>a+b,0)/this.grades.length; }
  getGrade(){
    let avg=this.getAverage();
    if(avg>=90) return "A";
    if(avg>=80) return "B";
    if(avg>=70) return "C";
    if(avg>=60) return "D";
    if(avg>=50) return "E";
    return "F";
  }
  getResult(){ if(this.getAverage()>=50 && this.attendance>=75) return "ناجح"; return "يحتاج مراجعة"; }
}
const studentsList = [
  new Student(1, "كريم سالم", [85,90,78], 95),
  new Student(2, "سلمي سامح ",  [70,50,60], 60),
  new Student(3, "محمد خالد", [60,70,65], 100),
  new Student(4, "ليان احمد", [40,44,46], 88),
];
const container = document.getElementById("students");
studentsList.forEach((s)=>{
  container.innerHTML += "<tr><td>" + s.name + "</td><td>" + s.getAverage().toFixed(2) + "</td><td>" + s.getGrade() + "</td><td>" + s.getResult() + "</td></tr>";
});
</script>
</body>
</html>
